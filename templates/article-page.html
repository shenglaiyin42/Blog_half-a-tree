<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ARTICLE_SUMMARY}}" />
    {{ARTICLE_SHARE_METADATA}}
    <link rel="canonical" href="{{ARTICLE_CANONICAL_URL}}" />
    <title>{{ARTICLE_TITLE}}｜半棵斋</title>
    <link rel="alternate" type="application/rss+xml" title="半棵斋 RSS" href="../rss.xml" />
    <link rel="stylesheet" href="../styles.css?v=writing-timeline-v1" />
  </head>
  <body>
    <header class="topbar">
      <nav class="wrap top-nav" aria-label="主导航">
        <a class="top-brand" href="/">半棵斋 <span>/ Half a Tree</span></a>
        <div class="top-links">
          <a class="top-link" href="/about/">About / 关于</a>
          <a class="top-link" href="/now/">Now / 现在</a>
          <a class="top-link" href="/rss.xml">RSS / 订阅</a>
        </div>
      </nav>
    </header>

    <main class="article-shell">
      <a class="article-back" href="/">← 返回主页</a>
      <article>
        <header class="article-header">
          <p class="article-meta"><span class="date-label">发表于</span><time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>{{UPDATED_META}}</p>
          <h1 class="article-title">{{ARTICLE_TITLE}}</h1>
          <div class="article-tags" aria-label="话题">{{ARTICLE_TOPICS}}</div>
        </header>
        <div class="article-body">
          {{ARTICLE_BODY}}
        </div>
      </article>
    </main>

    <footer class="site-footer wrap">
      <p>半棵斋｜Half a Tree</p>
      <p>Pages from a small room</p>
    </footer>
    <script src="../article-share.js?v=moments-poster-v7"></script>
  </body>
</html>
